worker_processes 1;  # 2 vCores VPS — keep nginx lean, app servers do the work.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 32M;

    upstream backend {
        server backend:8000;
    }
    upstream frontend {
        server frontend:3000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- HTTP → HTTPS redirects ----
    server {
        listen 80;
        server_name api.kwick.kreativefolio.com kwick.kreativefolio.com;
        return 301 https://$host$request_uri;
    }

    # ---- API + WebSocket (HTTPS) ----
    server {
        listen 443 ssl;
        http2 on;
        server_name api.kwick.kreativefolio.com;

        ssl_certificate     /etc/letsencrypt/live/kwick.kreativefolio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kwick.kreativefolio.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location /static/ { alias /var/www/static/; }
        location /media/  { alias /var/www/media/;  }

        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---- Frontend (HTTPS) ----
    server {
        listen 443 ssl;
        http2 on;
        server_name kwick.kreativefolio.com;

        ssl_certificate     /etc/letsencrypt/live/kwick.kreativefolio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kwick.kreativefolio.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
