worker_processes 1;  # 2 vCores VPS — keep nginx lean, app servers do the work.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 32M;   # 30MB chat attachment limit + multipart overhead headroom

    upstream backend {
        server backend:8000;
    }
    upstream frontend {
        server frontend:3000;
    }

    # WebSocket upgrade helper
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- API + WebSocket host (api.yourdomain.com) ----
    server {
        listen 80;
        server_name api.yourdomain.com;   # TODO: swap placeholder domain

        # Django static/media (collectstatic + local media; PDFs go to Object Storage)
        location /static/ { alias /var/www/static/; }
        location /media/  { alias /var/www/media/;  }

        # WebSockets (Channels): messaging + notifications
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---- Frontend host (yourdomain.com) ----
    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;   # TODO: swap placeholder domain

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # NOTE (IP-only testing): if you don't have a domain yet, comment out the two
    # server blocks above and use a single `server { listen 80; server_name _; ... }`
    # that proxies `/api` and `/ws` to backend and everything else to frontend.
}
