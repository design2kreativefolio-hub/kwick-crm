# Kwick — single-VPS deployment (OVH VPS-1: 2 vCores / 4 GB RAM).
# Resource limits are set conservatively so the whole stack fits in 4 GB.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # shared_buffers ~256MB, max_connections ~50 (spec §1).
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=50"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory 256MB, allkeys-lru — Channels layer + Celery broker only (spec §1).
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: 320M

  backend:
    build: ./backend
    restart: unless-stopped
    # 2 ASGI workers matches 2 vCores (spec §1). Daphne is single-process; we run
    # uvicorn with 2 workers for HTTP+WS concurrency.
    command:
      - "uvicorn"
      - "config.asgi:application"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "2"
    env_file: .env
    environment:
      CONTAINER_ROLE: web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media:/app/mediafiles
      - static:/app/staticfiles
    deploy:
      resources:
        limits:
          memory: 1024M

  celery-worker:
    build: ./backend
    restart: unless-stopped
    # concurrency 2 (spec §1).
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    env_file: .env
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  celery-beat:
    build: ./backend
    restart: unless-stopped
    command:
      - "celery"
      - "-A"
      - "config"
      - "beat"
      - "-l"
      - "info"
      - "--scheduler"
      - "django_celery_beat.schedulers:DatabaseScheduler"
    env_file: .env
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 384M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # enable once TLS certs are mounted (see nginx/README.md)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
  media:
  static:
